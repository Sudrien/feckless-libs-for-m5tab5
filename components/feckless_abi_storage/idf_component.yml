version: "0.9.4"
description: >-
  The feckless ABI's storage section: the storage handler, FatFs (with
  exFAT) and libc's file I/O for an app's ELF, from a launcher that links
  this; and the FatFs configuration both sides must share.
url: https://github.com/Sudrien/feckless-libs-for-m5tab5
license: MIT

dependencies:
  idf:
    version: ">=5.4.2"
  # feckless_abi, feckless_storage_handler and fatfs are this
  # repository's, required by name and named by the project at the same
  # tag. elf_loader comes through feckless_abi's manifest.
