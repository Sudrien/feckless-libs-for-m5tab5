## IDF Component Manager Manifest File
version: "0.10.3"
license: "Apache-2.0"
# Modified from Espressif's usb_host_msc 1.3.0 (esp-usb,
# host/class/msc/usb_host_msc): Defeatist's 5035 and 6031, marked
# "Vendored change" in the sources; and the espressif/usb override_path
# dropped (see below). Apache-2.0, see LICENCE. Its version is
# feckless-libs' since 3004; 1.3.0 is what it was modified from.
description: >-
  USB Host MSC driver: Espressif's usb_host_msc 1.3.0, with the Tab5's
  fixes (transfers sized to the DMA memory the Tab5 can give).
url: https://github.com/Sudrien/feckless-libs-for-m5tab5
dependencies:
  idf: ">=6.1"
  # IDF 6.0 took the USB host stack out of the tree and into the
  # registry as espressif/usb. Upstream's manifest also has an
  # override_path into the esp-usb repository; it is dropped here (it
  # points at nothing in this tree).
  espressif/usb:
    version: "^1.0.0"
    public: true
targets:
  - esp32s2
  - esp32s3
  - esp32p4
  - esp32h4
  - esp32s31
  - linux
files:
  exclude:
    - "test_app"
    - "host_test"
