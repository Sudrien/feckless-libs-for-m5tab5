version: "0.10.1"
description: >-
  A file chooser for the M5Stack Tab5's apps, drawn with gfx and driven
  by the app's own keys and taps: a folder's entries a row each, with
  sizes and dates, into folders and back out, the app deciding which
  files are wanted and what a chosen one means.
url: https://github.com/Sudrien/feckless-libs-for-m5tab5
license: MIT

dependencies:
  idf:
    version: ">=5.4.2"
  # feckless_graphics_handler and feckless_storage_handler are this
  # repository's, required by name and named by the project at the same tag.
