version: "0.8.7"
description: >-
  The feckless ABI's crypto section: Mbed TLS's keys, X.509 writer and
  hashing (PSA on Mbed TLS 4) for an app's ELF, from a launcher that
  links this.
url: https://github.com/Sudrien/feckless-libs-for-m5tab5
license: MIT

dependencies:
  idf:
    version: ">=5.4.2"
  # feckless_abi is this repository's, required by name and named by the
  # project at the same tag. elf_loader comes through feckless_abi's
  # manifest; mbedtls is IDF's.
