version: "0.9.10"
description: >-
  An on-screen keyboard for the M5Stack Tab5's apps, drawn with gfx and
  driven by the app's own taps: four rows staggered as a real keyboard's,
  a number row, shift and caps lock, and a symbol page.
url: https://github.com/Sudrien/feckless-libs-for-m5tab5
license: MIT

dependencies:
  idf:
    version: ">=5.4.2"
  # feckless_graphics_handler is this repository's, required by name and
  # named by the project at the same tag.
