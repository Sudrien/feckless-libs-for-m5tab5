version: "0.10.3"
description: >-
  The feckless ABI's network section: feckless_network_handler, lwIP's
  sockets, esp_netif, the HTTP server and client for an app's ELF, from
  a launcher that links this; and the configuration both sides share.
url: https://github.com/Sudrien/feckless-libs-for-m5tab5
license: MIT

dependencies:
  idf:
    version: ">=5.4.2"
  # feckless_abi and feckless_network_handler are this repository's,
  # required by name and named by the project at the same tag. elf_loader
  # comes through feckless_abi's manifest; esp_hosted and esp_wifi_remote
  # through the network handler's.
