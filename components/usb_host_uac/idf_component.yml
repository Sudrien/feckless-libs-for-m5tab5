## IDF Component Manager Manifest File
version: "0.10.3"
license: "Apache-2.0"
# Modified from Espressif's usb_host_uac 1.5.0 (esp-usb,
# host/class/uac/usb_host_uac): Defeatist's 5026, 5032 and 6062, marked
# "Vendored change" in uac_host.c; and the espressif/usb override_path
# dropped (see below). Apache-2.0, see LICENSE. Its version is
# feckless-libs' since 3006; 1.5.0 is what it was modified from.
description: >-
  USB Host UAC driver: Espressif's usb_host_uac 1.5.0, with the Tab5's
  fixes (a stream stopped once; its rings in PSRAM, freed as made).
url: https://github.com/Sudrien/feckless-libs-for-m5tab5
dependencies:
  idf: ">=6.1"
  cmake_utilities: "0.5.*"
  # IDF 6.0 took the USB host stack out of the tree and into the
  # registry as espressif/usb. Upstream's manifest also has an
  # override_path into the esp-usb repository; it is dropped here (it
  # points at nothing in this tree).
  espressif/usb:
    version: "^1.0.0"
    public: true
targets:
  - esp32s2
  - esp32s3
  - esp32s31
  - esp32p4
  - esp32h4
  - linux
files:
  exclude:
    - "test_app"
    - "host_test"
