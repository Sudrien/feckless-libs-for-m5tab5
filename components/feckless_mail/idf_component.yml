version: "0.10.1"
description: >-
  The outgoing mail account for the M5Stack Tab5's apps: SMTP server, TLS,
  login, app password, From and To, kept in NVS for a launcher and its apps
  to share, and a form to set it, drawn with gfx and typed on
  feckless_keyboard or a USB keyboard.
url: https://github.com/Sudrien/feckless-libs-for-m5tab5
license: MIT

dependencies:
  idf:
    version: ">=5.4.2"
  # feckless_nvs_handler, feckless_graphics_handler and feckless_keyboard
  # are this repository's, required by name and named by the project at
  # the same tag.
