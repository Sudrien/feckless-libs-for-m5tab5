version: "0.6.1"
description: >-
  The ABI between a Tab5 launcher and the apps it loads with esp_elf:
  the list of symbols an app's ELF may take from the launcher, and the
  check of the ELF against it.
url: https://github.com/Sudrien/feckless-libs-for-m5tab5
license: MIT

dependencies:
  idf:
    version: ">=5.4.2"

  # feckless_drivers and feckless_graphics_handler are this repository's
  # own, required by name in CMakeLists.txt and listed by the app at this
  # same tag (README.md). Before v0.1.0 they were pinned here by git url:
  # v0.5.10 and v0.2.9, whose code v0.1.0 has unchanged. usb_host_uac,
  # which the drivers require by name, moved to their manifest.

  # esp_elf: the host loads with it, and an app's ELF is linked by its
  # project_elf().
  espressif/elf_loader: "2.*"
