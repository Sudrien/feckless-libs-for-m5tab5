# The components' host tests, on every push and pull request.
name: Host tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: feckless_drivers
        run: make -C components/feckless_drivers/test
      - name: feckless_graphics_handler
        run: make -C components/feckless_graphics_handler/test
      # 9011: the lister, on a real folder.
      - name: feckless_storage_handler
        run: make -C components/feckless_storage_handler/test
      - name: feckless_network_handler
        run: make -C components/feckless_network_handler/test
      # 8010: against Spurious's code it was lifted from.
      - name: feckless_keyboard
        run: make -C components/feckless_keyboard/test
      # 9012: over the real storage_list.c.
      - name: feckless_chooser
        run: make -C components/feckless_chooser/test
      - name: feckless_mail
        run: make -C components/feckless_mail/test
      # 8012, 8013: the generator on a fixture.
      - name: feckless_libversions
        run: make -C components/feckless_libversions/test
      # 8003: the ABI's section filter and the crypto list.
      - name: feckless_abi section filter
        run: cmake -P components/feckless_abi/test/filter_test.cmake
      # 3002: fatfs's patch against each IDF the Tab5 projects build
      # with -- just components/fatfs, from a sparse clone.
      - name: fatfs patches ESP-IDF v5.5.5 and release/v6.1
        run: |
          set -euo pipefail
          for ref in v5.5.5 release/v6.1; do
            d="$RUNNER_TEMP/idf-${ref//\//-}"
            git clone -q --depth 1 --filter=blob:none --sparse -b "$ref" \
              https://github.com/espressif/esp-idf.git "$d"
            git -C "$d" sparse-checkout set components/fatfs
            cp -r "$d/components/fatfs" "$d/fatfs-copy"
            python3 components/fatfs/tools/patch_fatfs.py "$d/fatfs-copy"
            grep -E '^#define (FF_FS_EXFAT|FF_LBA64|FF_USE_TRIM)' "$d/fatfs-copy/src/ffconf.h"
          done
      - name: One version
        run: |
          set -euo pipefail
          n=$(grep -h '^version:' components/*/idf_component.yml | sort -u | wc -l)
          grep -H '^version:' components/*/idf_component.yml
          test "$n" -eq 1
